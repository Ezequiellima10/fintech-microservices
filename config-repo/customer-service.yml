server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:customers
    username: ${CUSTOMER_DB_USER:sa}
    password: ${CUSTOMER_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

clients:
  account:
    service-name: product-service
